# Provider credentials are referenced by environment variable name only.
[providers.deepseek]
base_url = "https://api.deepseek.com/v1"
api_key_env = "DEEPSEEK_API_KEY"
timeout_seconds = 60
max_retries = 2
retry_backoff_seconds = 0.5

[providers.qwen]
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
api_key_env = "DASHSCOPE_API_KEY"
timeout_seconds = 60
max_retries = 2
retry_backoff_seconds = 0.5

[models.cheap]
provider = "deepseek"
fallbacks = ["cheap_backup"]
model = "deepseek-chat"
stream_include_usage = true
response_format_json = true
# 按供应商实际价格配置，单位：美元/百万 token。
input_cost_per_million = 0.14
output_cost_per_million = 0.57

[models.strong]
provider = "deepseek"
fallbacks = ["cheap_backup"]
model = "deepseek-reasoner"
stream_include_usage = true
response_format_json = true
input_cost_per_million = 0.0
output_cost_per_million = 0.0

[models.cheap_backup]
provider = "qwen"
model = "qwen-turbo"
stream_include_usage = true
response_format_json = true

[models.embedding]
provider = "qwen"
model = "text-embedding-v3"

[routes]
intent_classification = "cheap"
query_rewrite = "cheap"
final_generation = "strong"
evaluation_judge = "cheap"
rerank = "cheap"
embedding = "embedding"
