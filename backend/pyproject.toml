[project]
name = "docmind-backend"
version = "0.1.0"
description = "DocMind enterprise RAG knowledge base API"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.14,<2.0",
    "asyncpg>=0.30,<1.0",
    "celery[redis]>=5.4,<6.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "jieba>=0.42,<1.0",
    "jinja2>=3.1,<4.0",
    "langchain-text-splitters>=0.3,<2.0",
    "pgvector>=0.3,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic-settings>=2.6,<3.0",
    "pymupdf>=1.24,<2.0",
    "python-multipart>=0.0.20,<1.0",
    "redis>=5.2,<7.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13,<2.0",
    "pytest>=8.3,<10.0",
    "pytest-asyncio>=0.24,<2.0",
    "pytest-cov>=6.0,<8.0",
    "ruff>=0.8,<1.0",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
markers = [
    "integration: requires PostgreSQL, Redis, or another real service",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["celery", "celery.*", "kombu", "kombu.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.workers.tasks"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["pymupdf", "pymupdf.*"]
ignore_missing_imports = true
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["jieba", "jieba.*"]
ignore_missing_imports = true
